name: Tests

on:
  push:
    paths:
      - "StudentLearningHub/**"
  pull_request:
    paths:
      - "StudentLearningHub/**"

jobs:
  pytest:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: StudentLearningHub

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
